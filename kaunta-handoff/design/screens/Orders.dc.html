<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kaunta counter: open orders</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 360px; height: 800px; overflow: hidden; background: #15100C; color: #F7EEE4; font-family: Manrope, system-ui, sans-serif; font-variant-numeric: tabular-nums; display: flex; flex-direction: column;">
  <div style="height: 60px; flex: none; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; gap: 6px; background: #1F1812; border-bottom: 1px solid #3D3127;">
    <a href="Sell.dc.html" aria-label="Back to Sell" style="width: 48px; height: 48px; border-radius: 12px; color: #F7EEE4; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
    <h1 style="flex: 1; margin: 0; font-size: 20px; font-weight: 800;">Open orders</h1>
    <div style="height: 36px; padding: 0 10px 0 8px; border-radius: 999px; border: 1px solid #1F4A38; background: #133226; color: #7BE3B3; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H7a5 5 0 1 1 1-9.9A6 6 0 0 1 19.4 10 4.5 4.5 0 0 1 17.5 19z M9 14l2 2 4-4"/></svg>Synced</div>
  </div>

  <div style="flex: none; padding: 14px 16px 6px; display: flex; justify-content: space-between; align-items: baseline;">
    <span style="font-size: 16px; color: #CDBCA9;">{{countLabel}} · still to collect</span>
    <span style="font-size: 26px; font-weight: 800;">{{dueLabel}}</span>
  </div>

  <div style="flex: none; display: flex; gap: 8px; padding: 6px 12px 10px; overflow-x: auto;">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
      <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="flex: none; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; font: inherit; font-size: 16px; font-weight: 700; white-space: nowrap; cursor: pointer;">{{f.label}}</button>
    </sc-for>
  </div>

  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 2px 12px 16px; display: flex; flex-direction: column; gap: 8px;">
    <sc-for list="{{shown}}" as="o" hint-placeholder-count="5">
      <a href="OrderDetail.dc.html" style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 14px; border: {{o.border}}; background: {{o.bg}}; color: #F7EEE4; text-decoration: none;">
        <span style="display: flex; justify-content: space-between; align-items: center; gap: 10px;"><span style="font-size: 19px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{o.label}}</span><span style="flex: none; font-size: 22px; font-weight: 800;">{{o.amount}}</span></span>
        <sc-if value="{{o.part}}" hint-placeholder-val="{{ false }}">
          <span style="display: block; height: 8px; border-radius: 999px; background: #3D3127; overflow: hidden;"><span style="display: block; width: {{o.pct}}; height: 8px; background: #7CB8FF;"></span></span>
        </sc-if>
        <span style="display: flex; justify-content: space-between; align-items: center; gap: 8px;">
          <span style="font-size: 15px; color: #CDBCA9; min-width: 0;">{{o.meta}}</span>
          <span style="flex: none; height: 30px; padding: 0 10px 0 6px; border-radius: 999px; background: {{o.chipBg}}; color: {{o.chipFg}}; display: inline-flex; align-items: center; gap: 5px; font-size: 15px; font-weight: 800; white-space: nowrap;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.icon}}"/></svg>{{o.chip}}</span>
        </span>
      </a>
    </sc-for>
    <sc-if value="{{none}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 56px 20px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px;">
        <svg width="64" height="64" viewBox="0 0 72 72" fill="none" stroke="#AE9B87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8h36v56l-6-4-6 4-6-4-6 4-6-4-6 4z M27 24h18 M27 34h18"/><path d="M26 46l6 6 14-14" stroke="#5DD39E"/></svg>
        <div style="font-size: 21px; font-weight: 800;">No open orders</div>
        <div style="font-size: 16px; line-height: 1.45; color: #CDBCA9;">Nothing here for this filter.</div>
      </div>
    </sc-if>
  </div>

  <div style="flex: none; padding: 12px 12px 14px; background: #1F1812; border-top: 1px solid #3D3127;">
    <a href="Sell.dc.html" style="min-height: 64px; border-radius: 14px; background: #FF8F3F; color: #1C1006; font-size: 18px; font-weight: 800; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"/></svg>New order</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { f: 'all' }; }
  renderVals() {
    const fmt = (n) => 'KES ' + n.toLocaleString('en-US');
    const clock = 'M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0z M12 7v5l3 2';
    const pie = 'M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0z M12 2v10h10';
    const raw = [
      { no: '#041', label: 'Mzee in blue', server: 'Akinyi', items: 6, min: 46, total: 2300, paid: 0, mine: false },
      { no: '#039', label: 'Table 2', server: 'Otieno', items: 4, min: 38, total: 1480, paid: 0, mine: false },
      { no: '#044', label: 'Table 9', server: 'Kiprop', items: 5, min: 22, total: 1250, paid: 400, mine: true },
      { no: '#047', label: 'Table 4', server: 'Me', items: 5, min: 12, total: 1250, paid: 0, mine: true },
      { no: '#048', label: 'Counter', server: 'Me', items: 2, min: 3, total: 600, paid: 0, mine: true }
    ];
    const all = raw.map((o) => {
      const old = o.min > 30;
      const part = o.paid > 0;
      return {
        ...o, old, part,
        amount: fmt(o.total - o.paid) + (part ? ' left' : ''),
        pct: Math.round((o.paid / o.total) * 100) + '%',
        meta: part ? o.no + ' · ' + o.server + ' · ' + fmt(o.paid) + ' of ' + o.total.toLocaleString('en-US') + ' paid' : o.no + ' · ' + o.server + ' · ' + o.items + ' items',
        border: old ? '2px solid #F2C94C' : '1px solid #3D3127', bg: old ? '#2A2312' : '#241C15',
        chip: old ? o.min + ' min · open long' : part ? o.min + ' min · part paid' : o.min + ' min',
        chipBg: old ? '#F2C94C' : '#172A42', chipFg: old ? '#241A02' : '#A6CEFF', icon: part && !old ? pie : clock
      };
    });
    const f = this.state.f;
    const shown = all.filter((o) => (f === 'mine' ? o.mine : f === 'old' ? o.old : true));
    const due = all.reduce((a, o) => a + o.total - o.paid, 0);
    const mk = (id, label) => {
      const on = f === id;
      return { label, on, bg: on ? '#F7EEE4' : '#241C15', fg: on ? '#15100C' : '#F7EEE4', border: on ? '#F7EEE4' : '#3D3127', pick: () => this.setState({ f: id }) };
    };
    return {
      shown, none: shown.length === 0, countLabel: all.length + ' open', dueLabel: fmt(due),
      filters: [mk('all', 'All · ' + all.length), mk('mine', 'Mine · ' + all.filter((o) => o.mine).length), mk('old', 'Over 30 min · ' + all.filter((o) => o.old).length)]
    };
  }
}
</script>
</body>
</html>
